[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prud-ai-e-com-daily"
version = "0.1.0"
description = "Local-first, cross-marketplace sales and advertising reporting core"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
dependencies = []

[project.scripts]
prud-ecom = "prud_ecom.__main__:main"

[project.urls]
Homepage = "https://github.com/PrudnikovMS/prud-ai-e-com-daily"
Issues = "https://github.com/PrudnikovMS/prud-ai-e-com-daily/issues"

[tool.setuptools.packages.find]
include = ["prud_ecom*"]
