name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m prud_ecom --sales examples/sales.csv --ads examples/ads.csv --group period --output output.csv
      - run: python -m prud_ecom.adapters map-csv --kind sales --input examples/source-sales.csv --mapping examples/mapping-sales.json --output demo-sales.csv
      - run: python -m prud_ecom.adapters map-csv --kind ads --input examples/source-ads.csv --mapping examples/mapping-ads.json --output demo-ads.csv
      - run: python -m prud_ecom --sales private/demo-sales.csv --ads private/demo-ads.csv --group period --output private/demo-report.csv
